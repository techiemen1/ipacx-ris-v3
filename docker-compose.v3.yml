# FILE: /home/ipacx/ipacx-ris-v3/docker-compose.v3.yml
version: "3.8"

services:
  # 1. iPaCX RIS/PACS v3.0 Web Frontend (Port 5000 - Avoids Port 3000 OHIF Conflict)
  ipacx-v3-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ipacx-v3-frontend
    restart: always
    ports:
      - "5000:80"
    depends_on:
      - ipacx-v3-backend
    networks:
      - ipacx-v3-network

  # 2. iPaCX RIS/PACS v3.0 Core Express Backend
  ipacx-v3-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipacx-v3-backend
    restart: always
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - DB_HOST=ipacx-v3-db
      - DB_PORT=5432
      - DB_NAME=pacsdb_v3
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - ORTHANC_URL=http://ipacx-v3-orthanc:8042/
      - ORTHANC_USER=orthanc
      - ORTHANC_PASSWORD=orthanc
      - REDIS_HOST=ipacx-v3-redis
      - REDIS_PORT=6379
    depends_on:
      ipacx-v3-db:
        condition: service_healthy
      ipacx-v3-orthanc:
        condition: service_started
    networks:
      - ipacx-v3-network

  # 3. PostgreSQL 15 Enterprise Relational Database
  ipacx-v3-db:
    image: postgres:15-alpine
    container_name: ipacx-v3-db
    restart: always
    environment:
      - POSTGRES_DB=pacsdb_v3
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - ipacx_v3_pgdata:/var/lib/postgresql/data
      - ./backend/db/v3_schema.sql:/docker-entrypoint-initdb.d/v3_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pacsdb_v3"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ipacx-v3-network

  # 4. Orthanc DICOM Server (DICOMweb / WADO-RS Node)
  ipacx-v3-orthanc:
    image: jodogne/orthanc-plugins:1.12.11
    container_name: ipacx-v3-orthanc
    restart: always
    ports:
      - "8043:8042"
      - "4243:4242"
    environment:
      - ORTHANC_NAME=iPaCX-Orthanc-v3
      - ORTHANC_JSON={"Name":"iPaCX-Orthanc-v3","RegisteredUsers":{"orthanc":"orthanc"},"DicomWeb":{"Enable":true,"Root":"/dicom-web/"}}
    volumes:
      - ipacx_v3_orthanc_data:/var/lib/orthanc/db
    networks:
      - ipacx-v3-network

  # 5. Redis High-Speed Cache & Pub/Sub
  ipacx-v3-redis:
    image: redis:7-alpine
    container_name: ipacx-v3-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - ipacx_v3_redis_data:/data
    networks:
      - ipacx-v3-network

networks:
  ipacx-v3-network:
    driver: bridge

volumes:
  ipacx_v3_pgdata:
  ipacx_v3_orthanc_data:
  ipacx_v3_redis_data:
