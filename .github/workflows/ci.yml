# GitHub Actions Production CI/CD Pipeline
name: iPaCX RIS/PACS v3.0 CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Vite Frontend Build
        run: npx vite build

      - name: Verify Core Backend Syntax
        run: node -c backend/server.js

      - name: Build Docker Services Stack
        run: docker compose -f docker-compose.v3.yml config
