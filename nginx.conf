# FILE: /home/ipacx/ipacx-ris-v3/nginx.conf
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA HTML5 History Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests dynamically to backend service
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "http://ipacx-v3-backend:5003";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy OHIF DICOM Viewer requests to Orthanc PACS with pre-authenticated credentials
    location /ohif/ {
        resolver 127.0.0.11 valid=30s;
        set $orthanc "http://ipacx-v3-orthanc:8042";
        proxy_pass $orthanc/ohif/;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy DICOMweb requests for OHIF viewer
    location /dicom-web/ {
        resolver 127.0.0.11 valid=30s;
        set $orthanc "http://ipacx-v3-orthanc:8042";
        proxy_pass $orthanc/dicom-web/;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy WADO requests for OHIF viewer
    location /wado {
        resolver 127.0.0.11 valid=30s;
        set $orthanc "http://ipacx-v3-orthanc:8042";
        proxy_pass $orthanc/wado;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
